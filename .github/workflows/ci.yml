name: CI

on:
  push:
    paths:
      - 'foundry/**'
      - 'pipeline/**'
      - '3d-prerender/**'
      - 'tests/**'
      - 'exports/**/manifest.json'
      - 'verify.sh'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'foundry/**'
      - 'pipeline/**'
      - '3d-prerender/**'
      - 'tests/**'
      - 'exports/**/manifest.json'
      - 'verify.sh'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      # Fast pre-check: fail early on import/parser breakage before the full script.
      - name: Verify foundry module (fast pre-check)
        run: |
          python -c "from foundry import db; from foundry import cli; print('OK: imports')"
          python -c "from foundry.cli import build_parser; p = build_parser(); print('OK: parser')"

      # 3d-prerender scripts need bpy/torch/trellis2, which aren't installable on
      # ubuntu-latest — so this is syntax-only (py_compile), never a real import.
      - name: Syntax-check 3d-prerender scripts
        run: python -m py_compile 3d-prerender/*.py

      # texture_patch_region.py's pure functions (classify_skin_mask, pick_patch_color,
      # rasterize_and_dilate) only need numpy/Pillow/scipy/trimesh/hypothesis — all
      # CPU-only and installable on ubuntu-latest, unlike the GPU stages.
      - name: Install 3d-prerender test dependencies
        run: python -m pip install pytest numpy Pillow scipy trimesh hypothesis

      - name: Run 3d-prerender pure-logic tests
        run: pytest 3d-prerender/test_texture_patch_region.py -v

      # Run the repo's real safety net. verify.sh is the source of truth: it checks
      # db constants (8 directions, schema_version >= 2), the CLI parser, export-pack
      # structure (albedo/normal/depth dirs + 8-PNG counts), the roster index, and
      # required files. It tolerates zero export packs gracefully.
      - name: Run verify.sh
        run: bash verify.sh

      # Lightweight manifest schema_version check, complementary to verify.sh's
      # structural pack validation. Walks exports/ once and tolerates an empty tree.
      - name: Validate export manifests
        run: |
          python -c "
          import json, pathlib, sys
          manifests = sorted(pathlib.Path('exports').rglob('manifest.json'))
          errors = 0
          for m in manifests:
              try:
                  data = json.loads(m.read_text())
                  assert 'schema_version' in data, f'missing schema_version in {m}'
              except Exception as e:
                  print(f'FAIL: {m} — {e}')
                  errors += 1
          print(f'Checked {len(manifests)} manifests')
          sys.exit(1 if errors else 0)
          "
